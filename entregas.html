<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6b3f20">
<title>Entregas · Vanessa Doces Finos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{--brand:#d94d7d;--brown:#6b3f20;--bg:#f7f8fa;--t1:#111827;--t2:#4b5563;--t3:#9ca3af;--ok:#15803d;--warn:#b45309;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins','Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:var(--bg);color:var(--t1);display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
.top{background:var(--brown);color:#fff;min-height:54px;display:flex;align-items:center;padding:0 12px;gap:10px;flex:none;}
.top h1{font-size:19px;font-weight:700;white-space:nowrap;}
.dia{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:10px;padding:0 4px;height:40px;}
.dia b{font-size:16px;min-width:128px;text-align:center;cursor:pointer;white-space:nowrap;}
.dia button,.tb{background:transparent;border:0;color:#fff;font-size:24px;width:42px;height:40px;border-radius:8px;cursor:pointer;}
.tb{background:rgba(255,255,255,.14);font-size:20px;}
.tb:active,.dia button:active{background:rgba(255,255,255,.3);}
.resumo{flex:1;text-align:right;line-height:1.15;min-width:0;}
.resumo small{display:block;font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.resumo small.off{color:#fde68a;opacity:1;font-weight:600;}
.resumo b{font-size:18px;white-space:nowrap;}
#corpo{flex:1;min-height:0;display:flex;}
#painel{display:none;}
#lista{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:min-content;gap:10px;align-content:start;}
.sep{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;padding:2px 4px 0;}
.vazio{grid-column:1/-1;text-align:center;color:var(--t2);padding:60px 20px;font-size:20px;}
.vazio small{display:block;font-size:13px;color:var(--t3);margin-top:6px;}

/* cartão — modo grande (até 6 entregas) */
.c{background:#fff;border-radius:14px;border:1px solid #e8eaee;padding:10px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,.04);min-width:0;}
.l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0;}
.nome{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.saldo{font-size:17px;font-weight:700;color:var(--warn);white-space:nowrap;}
.saldo.pago{color:var(--ok);}
.end{display:block;background:#fdf2f6;border:1.5px solid #f9d0df;color:var(--brand);border-radius:10px;padding:8px 10px;font-size:15px;font-weight:600;line-height:1.25;text-decoration:none;min-height:48px;}
.end small{display:block;color:var(--t2);font-weight:400;font-size:12px;margin-top:1px;}
.end.ret{background:#f3f4f6;border-color:#e5e7eb;color:var(--t2);}
.acoes{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;}
.btn{height:46px;border-radius:10px;font-size:16px;font-weight:700;border:1.5px solid #d1d5db;background:#fff;color:var(--t1);display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;cursor:pointer;}
.btn i{font-style:normal;}
.btn.ent{background:var(--ok);border-color:var(--ok);color:#fff;}
.btn.off{opacity:.35;pointer-events:none;}
.btn:active{filter:brightness(.92);}
.c.feito{background:#f3f4f6;box-shadow:none;}
.c.feito .nome{color:var(--t3);text-decoration:line-through;}
.c.feito .saldo{color:var(--t3);}
.c.feito .end{background:#f3f4f6;border-color:#e5e7eb;color:var(--t3);}
.c.feito .acoes{grid-template-columns:1fr;}
.c.feito .btn{height:38px;font-size:14px;color:var(--t2);}

/* cartão — modo compacto (7 ou mais entregas) */
#lista.mini{padding:8px;gap:8px;}
.mini .c{display:grid;grid-template-columns:1fr auto;grid-template-areas:"l1 ac" "end ac";gap:4px 10px;align-items:center;padding:7px 8px 7px 12px;border-radius:12px;}
.mini .l1{grid-area:l1;} .mini .end{grid-area:end;} .mini .acoes{grid-area:ac;display:flex;gap:6px;}
.mini .nome{font-size:17px;} .mini .saldo{font-size:15px;}
.mini .end{padding:5px 8px;font-size:13.5px;border-radius:9px;min-height:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.mini .end small{display:inline;font-size:inherit;font-weight:600;color:inherit;margin:0;}
.mini .end small::before{content:" · ";}
.mini .btn{width:74px;height:62px;flex-direction:column;gap:1px;font-size:12px;border-radius:10px;}
.mini .btn i{font-size:20px;line-height:1;}
.mini .c.feito{padding:5px 8px 5px 12px;}
.mini .c.feito .nome{font-size:15px;}
.mini .c.feito .end{background:transparent;border-color:transparent;padding:0 2px;font-weight:500;}
.mini .c.feito .btn{width:84px;height:40px;flex-direction:row;font-size:12px;}

/* tela larga (multimídia/tablet): lista à esquerda + mapa do Google à direita */
body.dividida #lista{flex:none;width:372px;display:flex;flex-direction:column;gap:6px;padding:8px;background:#fff;border-right:1px solid #e5e7eb;}
body.dividida #painel{display:block;flex:1;position:relative;background:#e8eaed;min-width:0;}
#mapa{position:absolute;inset:0;width:100%;height:100%;border:0;background:#e8eaed;}
#mapaVazio{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--t2);font-size:17px;padding:30px;line-height:1.4;}
#mapaVazio small{display:block;color:var(--t3);font-size:12px;margin-top:6px;}
#mapaBarra{position:absolute;left:8px;right:8px;top:8px;display:none;gap:6px;align-items:center;background:rgba(255,255,255,.96);border-radius:12px;padding:6px 8px;box-shadow:0 2px 10px rgba(0,0,0,.3);z-index:2;}
#mapaTit{flex:1;min-width:0;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#mapaTit b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;}
#mapaBarra .mb{height:42px;padding:0 12px;border-radius:10px;border:1.5px solid #d1d5db;background:#fff;color:var(--t1);font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px;text-decoration:none;white-space:nowrap;cursor:pointer;}
#mapaBarra .mb.on{background:var(--brand);border-color:var(--brand);color:#fff;}
#mapaBarra .mb.go{background:var(--ok);border-color:var(--ok);color:#fff;}
.lh{border:1.5px solid #e8eaee;border-radius:12px;padding:7px 9px;display:flex;flex-direction:column;gap:3px;background:#fff;cursor:pointer;flex:none;}
.lh .l1{display:flex;align-items:center;gap:8px;justify-content:flex-start;}
.lh .n{width:26px;height:26px;border-radius:50%;background:#e5e7eb;color:var(--t3);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;}
.lh .n.on{background:var(--brand);color:#fff;}
.lh .nome{font-size:15px;flex:1;min-width:0;}
.lh .saldo{font-size:13px;}
.lh .le{font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:34px;}
.lh.sel{border-color:var(--brand);background:#fdf2f6;box-shadow:0 0 0 2px #f9d0df;}
.lh.sel .le{white-space:normal;color:var(--brand);font-weight:600;font-size:13px;}
.lh .ac{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;margin-top:5px;padding-left:34px;}
.lh .ac .btn{height:40px;font-size:12px;border-radius:9px;gap:4px;padding:0 4px;text-align:center;line-height:1.1;}
.lh .ac .btn.ord{background:var(--brand);border-color:var(--brand);color:#fff;}
.lh.sp .le{color:var(--warn);}
.lh.f{background:#f3f4f6;border-color:#eceef1;}
.lh.f .nome{color:var(--t3);text-decoration:line-through;}
.lh.f .n{background:#e5e7eb;color:#9ca3af;}
.lh.f .desf{margin:4px 0 0 34px;height:34px;font-size:12px;color:var(--t2);}
body.dividida .sep{padding:4px 4px 0;}

/* retrato / telas estreitas: uma coluna */
@media (max-width:700px){
  #lista{grid-template-columns:1fr;}
  .top h1{display:none;}
  .dia b{min-width:104px;font-size:14px;}
}

#aviso{display:none;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--brown);color:#fff;border-radius:14px;padding:12px 22px;text-align:center;font-size:16px;line-height:1.35;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:10;max-width:90%;}
#aviso b{font-size:28px;letter-spacing:.02em;}
#aviso small{display:block;font-size:12px;opacity:.85;}
#aviso .an{font-size:15px;opacity:.9;}
#aviso .ar{display:flex;gap:10px;justify-content:center;margin:8px 0 4px;}
#aviso .ab,#aviso .fx{height:46px;padding:0 18px;border-radius:10px;border:0;font-size:16px;font-weight:700;display:flex;align-items:center;text-decoration:none;}
#aviso .ab{background:#fff;color:var(--brown);} #aviso .fx{background:rgba(255,255,255,.18);color:#fff;}
#cfg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;align-items:center;justify-content:center;}
.cfg-box{background:#fff;border-radius:14px;width:min(640px,94%);max-height:92%;display:flex;flex-direction:column;padding:14px;gap:8px;}
.cfg-top{display:flex;justify-content:space-between;align-items:center;font-size:17px;}
.cfg-top .fx{height:40px;padding:0 14px;border-radius:10px;border:1.5px solid #d1d5db;background:#fff;font-size:15px;font-weight:600;}
#cfgBusca{height:46px;border:1.5px solid #d1d5db;border-radius:10px;padding:0 12px;font-size:16px;user-select:text;-webkit-user-select:text;}
#cfgLista{flex:1;min-height:120px;overflow-y:auto;border:1px solid #eee;border-radius:10px;}
#cfgLista button{display:block;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid #f0f2f5;background:#fff;font-size:16px;}
#cfgLista button small{display:block;color:var(--t3);font-size:11px;}
#cfgLista button.sel{background:#fdf2f6;color:var(--brand);font-weight:700;}
#cfgInfo{color:var(--t3);font-size:11px;word-break:break-word;}
.cfg-man{display:flex;gap:8px;} .cfg-man input{flex:1;height:42px;border:1.5px solid #d1d5db;border-radius:10px;padding:0 12px;font-size:14px;user-select:text;-webkit-user-select:text;}
.cfg-man button{height:42px;padding:0 16px;border-radius:10px;border:0;background:var(--brand);color:#fff;font-weight:700;font-size:14px;}
/* login */
.login{grid-column:1/-1;max-width:420px;margin:30px auto;background:#fff;border-radius:14px;padding:22px;border:1px solid #e8eaee;display:flex;flex-direction:column;gap:12px;user-select:text;-webkit-user-select:text;}
.login h2{font-size:18px;color:var(--brown);}
.login input{height:50px;border:1.5px solid #d1d5db;border-radius:10px;padding:0 12px;font-size:17px;}
.login button{height:50px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-size:17px;font-weight:700;}
.login p{font-size:13px;color:#b91c1c;min-height:16px;}
</style>
</head>
<body>
<div class="top">
  <h1>🚚 Entregas</h1>
  <div class="dia"><button id="bAnt" aria-label="Dia anterior">‹</button><b id="rotDia" title="Voltar para hoje">—</b><button id="bProx" aria-label="Próximo dia">›</button></div>
  <div class="resumo"><small id="sub">carregando…</small><b id="areceber"></b></div>
  <button class="tb" id="bCfg" aria-label="Configurar" style="display:none">⚙</button>
  <button class="tb" id="bTela" aria-label="Tela cheia">⛶</button>
  <button class="tb" id="bRef" aria-label="Atualizar">↻</button>
</div>
<div id="corpo">
  <div id="lista"></div>
  <div id="painel">
    <iframe id="mapa" title="Mapa" allow="geolocation" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <div id="mapaVazio">Toque numa entrega para ver no mapa<small>Use o dedo para arrastar e dar zoom no mapa.</small></div>
    <div id="mapaBarra">
      <div id="mapaTit"></div>
      <button class="mb" id="bSat" aria-label="Satélite">🛰 Satélite</button>
      <a class="mb go" id="bNav" href="#" aria-label="Navegar">▶ Navegar</a>
    </div>
  </div>
</div>
<div id="aviso" role="status"></div>
<div id="cfg"><div class="cfg-box"><div class="cfg-top"><b>⚙ Configurações</b><button class="fx" id="cfgFechar">Fechar</button></div>
  <div class="soapk" style="display:none;flex-direction:column;gap:8px;min-height:0;flex:1;"><b style="font-size:15px">📞 App de telefone do carro</b>
  <input id="cfgBusca" type="text" placeholder="Filtrar (ex.: bluetooth, telefone, BT)" autocomplete="off">
  <div id="cfgLista"></div>
  <div class="cfg-man"><input id="cfgPac" type="text" placeholder="ou digite o pacote do app (avançado)" autocomplete="off"><button id="cfgUsar">Usar</button></div>
  <small id="cfgInfo"></small></div></div></div>

<script>
/* ===== configuração (a mesma do app principal) ===== */
var SUPABASE_URL = 'https://stwqlmxymyixgbwxynxh.supabase.co';
var SUPABASE_KEY = 'sb_publishable_jBjgD5yEzdHdGT1pEZ6Jkw_kj3lowPV';
/* Endereços sem cidade ganham este sufixo na busca do mapa. Deixe '' para não acrescentar nada. */
var CIDADE_PADRAO = ', Campos dos Goytacazes, RJ';
var LIMITE_GRANDE = 6;            /* até 6 entregas no dia: cartões grandes; 7 ou mais: compacto */
var ATUALIZA_MS = 3 * 60 * 1000;

/* dentro do APK (Capacitor) existem funções nativas; no navegador tudo continua funcionando sem elas */
var NATIVO = !!(window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android');
var Nativo = (NATIVO && window.Capacitor.registerPlugin) ? window.Capacitor.registerPlugin('Nativo') : null;
var sb = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
var dia = hoje(), cards = [], clientes = null, clientesEm = 0, ultimaCarga = 0;
var selId = '', satelite = false, _mapaUrl = '', DIVIDIDA = false;
var offline = false, atualizadoEm = '', carregando = false, precisaLogin = false, carregouDia = '';

/* ===== utilitários ===== */
function pad(n) { return String(n).padStart(2, '0'); }
function dataLocal(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function hoje() { return dataLocal(new Date()); }
function somaDias(iso, n) { var d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return dataLocal(d); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function dig(s) { return String(s || '').replace(/\D/g, ''); }
function brl(n) { return 'R$ ' + (n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function rotuloDia(iso) {
  var d = new Date(iso + 'T12:00:00'), s = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][d.getDay()] + ' ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
  var dif = Math.round((d - new Date(hoje() + 'T12:00:00')) / 86400000);
  return s + (dif === 0 ? ' · hoje' : dif === 1 ? ' · amanhã' : dif === -1 ? ' · ontem' : '');
}
function hhmm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function linkMapa(end) {
  var q = end.trim();
  if (CIDADE_PADRAO && !/campos|goytacazes|,\s*rj\b|\brj\b/i.test(q)) q += CIDADE_PADRAO;
  return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination=' + encodeURIComponent(q);   /* dir_action=navigate: já inicia a navegação */
}

/* ===== ordem das entregas (decidida por você) e ponto de partida: guardados neste aparelho ===== */
function lerOrdem(d) { try { var o = JSON.parse(localStorage.getItem('vdf_ordem_' + d) || '[]'); return Array.isArray(o) ? o : []; } catch (e) { return []; } }
function gravarOrdem(d, o) { try { localStorage.setItem('vdf_ordem_' + d, JSON.stringify(o)); } catch (e) {} }
function enderecoBusca(end) {
  var q = (end || '').trim();
  if (CIDADE_PADRAO && q && !/campos|goytacazes|,\s*rj\b|\brj\b/i.test(q)) q += CIDADE_PADRAO;
  return q;
}

/* ===== "entregue": guardado só neste aparelho, por dia ===== */
function chaveEnt(d) { return 'vdf_entregues_' + d; }
function lerEnt(d) { try { return JSON.parse(localStorage.getItem(chaveEnt(d)) || '{}') || {}; } catch (e) { return {}; } }
function gravarEnt(d, o) { try { localStorage.setItem(chaveEnt(d), JSON.stringify(o)); } catch (e) {} }
function limparAntigos() {
  try {
    var corte = somaDias(hoje(), -14);
    Object.keys(localStorage).forEach(function (k) {
      var m = /^vdf_(entregues|lista|ordem)_(\d{4}-\d{2}-\d{2})$/.exec(k);
      if (m && m[2] < corte) localStorage.removeItem(k);
    });
  } catch (e) {}
}
function gravarCache(d) { try { localStorage.setItem('vdf_lista_' + d, JSON.stringify({ t: Date.now(), cards: cards })); } catch (e) {} }
function lerCache(d) { try { return JSON.parse(localStorage.getItem('vdf_lista_' + d) || 'null'); } catch (e) { return null; } }

/* ===== dados ===== */
async function listarClientes() {
  if (clientes && Date.now() - clientesEm < 30 * 60 * 1000) return clientes;
  var tudo = [];
  try {
    for (var ini = 0; ; ini += 1000) {
      var r = await sb.from('clientes').select('*').order('id', { ascending: true }).range(ini, ini + 999);
      if (r.error) throw r.error;
      var lote = r.data || []; tudo = tudo.concat(lote);
      if (lote.length < 1000) break;
    }
    clientes = tudo; clientesEm = Date.now();
  } catch (e) { console.error('clientes:', e); if (!clientes) clientes = []; }   /* só serve de reserva de endereço: não é fatal */
  return clientes;
}
function acharCliente(p, lista) {
  var t = dig(p.telefone), n = (p.cliente || '').trim().toLowerCase();
  var i, c;
  if (t) for (i = 0; i < lista.length; i++) { c = lista[i]; if (dig(c.id) === t || dig(c.tel) === t) return c; }
  if (n) for (i = 0; i < lista.length; i++) { c = lista[i]; if ((c.nome || '').trim().toLowerCase() === n) return c; }
  return null;
}
function montarCards(pedidos, lista) {
  return pedidos.filter(function (p) { return p.status !== 'cancelado'; }).map(function (p) {
    var cad = acharCliente(p, lista) || {};
    var saldo = Math.round(((p.total || 0) - (p.entrada || 0)) * 100) / 100;
    return {
      id: String(p.id), nome: (p.cliente || '—').trim() || '—',
      end: ((p.endereco || '').trim() || (cad.end || '').trim()),       /* o endereço do pedido vale; o do cadastro é reserva */
      tel: dig(p.telefone) || dig(cad.tel),
      obs: (p.obs || '').trim(), saldo: saldo, pago: saldo <= 0.005
    };
  });
}
async function carregar() {
  if (carregando) return;
  var diaReq = dia;
  if (!sb) { usarCache(diaReq); return; }
  carregando = true;
  try {
    var s = await sb.auth.getSession();
    if (!s.data || !s.data.session) { precisaLogin = true; desenhar(); return; }
    precisaLogin = false;
    var r = await sb.from('pedidos').select('*').eq('data', diaReq).order('id', { ascending: true });
    if (r.error) throw r.error;
    var lista = await listarClientes();
    if (dia !== diaReq) return;                      /* o usuário já trocou de dia */
    cards = montarCards(r.data || [], lista);
    offline = false; carregouDia = diaReq; atualizadoEm = hhmm(new Date()); ultimaCarga = Date.now();
    gravarCache(diaReq);
    desenhar();
  } catch (e) {
    console.error('carregar:', e);
    usarCache(diaReq);
  } finally { carregando = false; }
}
function usarCache(d) {
  if (dia !== d) return;
  var c = lerCache(d);
  cards = c ? c.cards : []; offline = true; carregouDia = d; atualizadoEm = c ? hhmm(new Date(c.t)) : '';
  precisaLogin = false; desenhar();
}

/* ===== tela ===== */
function btnLigar(c) {
  return c.tel ? '<button class="btn" data-acao="lig" data-tel="' + esc(c.tel) + '"><i>📞</i><span>Ligar</span></button>'
               : '<span class="btn off"><i>📞</i><span>Ligar</span></span>';
}
function fmtTel(t) {
  t = dig(t); if (t.length > 11 && t.indexOf('55') === 0) t = t.slice(2);
  if (t.length === 11) return '(' + t.slice(0, 2) + ') ' + t.slice(2, 7) + '-' + t.slice(7);
  if (t.length === 10) return '(' + t.slice(0, 2) + ') ' + t.slice(2, 6) + '-' + t.slice(6);
  return t;
}
function discadorAtual() { try { return JSON.parse(localStorage.getItem('vdf_discador') || 'null'); } catch (e) { return null; } }
function avisoTel(nome, tel) {
  var a = document.getElementById('aviso'), d = discadorAtual(), abrir;
  if (NATIVO && d && d.pacote) abrir = '<button class="ab" data-acao="abrirtel">📞 Abrir ' + esc(d.nome || 'telefone') + '</button>';
  else if (NATIVO) abrir = '<a class="ab" href="tel:' + esc(tel) + '">📞 Abrir telefone</a>';
  else abrir = '<a class="ab" href="intent://' + esc(tel) + '#Intent;scheme=tel;action=android.intent.action.DIAL;end">📞 Abrir telefone</a>';
  a.innerHTML = '<div class="an">' + esc(nome) + '</div><b>' + esc(fmtTel(tel)) + '</b><div class="ar">' + abrir + '<button class="fx" data-acao="fechaviso">Fechar</button></div>' +
    '<small>' + (NATIVO && !(d && d.pacote) ? 'Toque em ⚙ no topo para escolher o app de telefone do carro' : 'disque este número no telefone do carro') + '</small>';
  a.style.display = 'block';
}
function htmlEnd(c) {
  if (!c.end) return '<div class="end ret">🏠 Retirada no local — sem endereço</div>';
  return '<a class="end" href="' + esc(linkMapa(c.end)) + '"' + (NATIVO ? '' : ' target="_blank" rel="noopener"') + '>📍 ' + esc(c.end) + (c.obs ? '<small>' + esc(c.obs) + '</small>' : '') + '</a>';
}
function htmlSaldo(c, feito) {
  return (c.pago && !feito) ? '<span class="saldo pago">Pago ✓</span>' : '<span class="saldo">' + (c.pago ? 'Pago ✓' : brl(c.saldo)) + '</span>';
}
function htmlCard(c, feito) {
  var acoes = feito
    ? '<button class="btn" data-acao="des" data-id="' + esc(c.id) + '"><i>↩</i><span>Desfazer</span></button>'
    : btnLigar(c) + '<button class="btn ent" data-acao="ent" data-id="' + esc(c.id) + '"><i>✓</i><span>Entregue</span></button>';
  return '<div class="c' + (feito ? ' feito' : '') + '"><div class="l1"><span class="nome">' + esc(c.nome) + '</span>' + htmlSaldo(c, feito) + '</div>' +
    htmlEnd(c) + '<div class="acoes">' + acoes + '</div></div>';
}
function porNome(a, b) { return a.nome.localeCompare(b.nome, 'pt-BR', { sensitivity: 'base' }); }
function desenhar() {
  var L = document.getElementById('lista');
  document.getElementById('rotDia').textContent = rotuloDia(dia);
  if (precisaLogin) {
    document.getElementById('sub').textContent = 'entre para ver as entregas'; document.getElementById('sub').className = '';
    document.getElementById('areceber').textContent = '';
    L.className = '';
    L.innerHTML = '<form class="login" id="fLogin"><h2>🔒 Entrar</h2><input id="lEmail" type="email" placeholder="E-mail" autocomplete="username"><input id="lSenha" type="password" placeholder="Senha" autocomplete="current-password"><p id="lErro"></p><button type="submit">Entrar</button></form>';
    return;
  }
  var ent = lerEnt(dia);
  var pend = cards.filter(function (c) { return !ent[c.id]; }).sort(porNome);
  var feitos = cards.filter(function (c) { return ent[c.id]; }).sort(porNome);
  var aReceber = pend.reduce(function (a, c) { return a + (c.saldo > 0 ? c.saldo : 0); }, 0);
  var sub = document.getElementById('sub');
  sub.textContent = pend.length + ' a entregar · ' + feitos.length + ' feita' + (feitos.length === 1 ? '' : 's') + (offline ? ' · ⚠ sem conexão' + (atualizadoEm ? ' (lista das ' + atualizadoEm + ')' : '') : '');
  sub.className = offline ? 'off' : '';
  document.getElementById('areceber').textContent = cards.length ? 'A receber: ' + brl(aReceber) : '';
  L.className = (!DIVIDIDA && cards.length > LIMITE_GRANDE) ? 'mini' : '';
  if (!cards.length && carregouDia !== dia) { L.innerHTML = '<div class="vazio">Carregando…</div>'; return; }
  if (!cards.length) {
    L.innerHTML = offline
      ? '<div class="vazio">⚠ Sem conexão<small>Não há lista guardada para este dia. Toque em ↻ quando a internet voltar.</small></div>'
      : '<div class="vazio">Nenhuma entrega para este dia 🎉</div>';
    return;
  }
  var rol = L.scrollTop, h;
  if (DIVIDIDA) {
    var ord = ordemPendentes(pend);
    var comOrdem = ord.map(function (id) { return pend.filter(function (c) { return c.id === id; })[0]; });
    var semOrdem = pend.filter(function (c) { return ord.indexOf(c.id) < 0; });
    h = comOrdem.map(function (c, i) { return htmlLinha(c, i + 1, false); }).join('') + semOrdem.map(function (c) { return htmlLinha(c, 0, false); }).join('');
    if (feitos.length) h += '<div class="sep">Entregues (' + feitos.length + ')</div>' + feitos.map(function (c) { return htmlLinha(c, 0, true); }).join('');
  } else {
    h = pend.map(function (c) { return htmlCard(c, false); }).join('');
    if (feitos.length) h += '<div class="sep">Entregues (' + feitos.length + ')</div>' + feitos.map(function (c) { return htmlCard(c, true); }).join('');
  }
  L.innerHTML = h; L.scrollTop = rol;
}
/* ordem escolhida, só com as entregas ainda pendentes deste dia */
function ordemPendentes(pend) {
  var ids = pend.map(function (c) { return c.id; });
  return lerOrdem(dia).filter(function (id) { return ids.indexOf(id) >= 0; });
}
function htmlLinha(c, n, feito) {
  var sel = (c.id === selId) && !feito;
  var cls = 'lh' + (sel ? ' sel' : '') + (feito ? ' f' : '') + (!c.end && !feito ? ' sp' : '');
  var end = c.end ? (c.end + (c.obs ? ' · ' + c.obs : '')) : 'Retirada no local — sem endereço';
  var h = '<div class="' + cls + '" data-sel="' + esc(c.id) + '"><div class="l1"><span class="n' + (n ? ' on' : '') + '">' + (feito ? '✓' : (n || '–')) + '</span><span class="nome">' + esc(c.nome) + '</span>' + htmlSaldo(c, feito) + '</div>';
  if (!feito) h += '<div class="le">' + esc(end) + '</div>';
  if (feito) h += '<button class="btn desf" data-acao="des" data-id="' + esc(c.id) + '"><i>↩</i><span>Desfazer</span></button>';
  else if (sel) {
    h += '<div class="ac"><button class="btn ord" data-acao="ord" data-id="' + esc(c.id) + '"><span>' + (n ? '✕ Tirar da ordem' : '📍 Colocar na ordem') + '</span></button>' +
      (c.tel ? '<button class="btn" data-acao="lig" data-tel="' + esc(c.tel) + '"><i>📞</i><span>Ligar</span></button>' : '<span class="btn off"><i>📞</i><span>Ligar</span></span>') +
      '<button class="btn ent" data-acao="ent" data-id="' + esc(c.id) + '"><i>✓</i><span>Entregue</span></button></div>';
  }
  return h + '</div>';
}

/* ===== mapa do Google (incorporado, sem chave) ===== */
function cardSel() { return cards.filter(function (c) { return c.id === selId; })[0] || null; }
function urlMapa(c) {
  var t = satelite ? 'k' : 'm', dest = enderecoBusca(c.end);
  return 'https://maps.google.com/maps?q=' + encodeURIComponent(dest) + '&z=16&t=' + t + '&hl=pt-BR&output=embed';
}
function atualizarMapa() {
  var c = cardSel(), fr = document.getElementById('mapa'), vazio = document.getElementById('mapaVazio'), barra = document.getElementById('mapaBarra');
  if (!DIVIDIDA) return;
  if (!c) { vazio.style.display = 'flex'; vazio.firstChild.textContent = 'Toque numa entrega para ver no mapa'; barra.style.display = 'none'; fr.style.visibility = 'hidden'; return; }
  barra.style.display = 'flex';
  document.getElementById('mapaTit').innerHTML = '<b>' + esc(c.nome) + '</b>' + esc(c.end || 'Retirada no local');
  document.getElementById('bSat').className = 'mb' + (satelite ? ' on' : '');
  var nav = document.getElementById('bNav');
  if (!c.end) { vazio.style.display = 'flex'; vazio.firstChild.textContent = 'Retirada no local — sem endereço para mostrar'; fr.style.visibility = 'hidden'; nav.style.display = 'none'; _mapaUrl = ''; return; }
  nav.style.display = ''; nav.href = linkMapa(c.end);
  if (NATIVO) nav.removeAttribute('target'); else { nav.target = '_blank'; nav.rel = 'noopener'; }
  vazio.style.display = 'none'; fr.style.visibility = 'visible';
  var u = urlMapa(c);
  if (u !== _mapaUrl) { _mapaUrl = u; fr.src = u; }          /* só recarrega o mapa quando algo mudou */
}
function ajustarLayout() {
  var larga = window.innerWidth >= 820;
  if (larga !== DIVIDIDA) { DIVIDIDA = larga; document.body.className = larga ? 'dividida' : ''; desenhar(); atualizarMapa(); }
}
window.addEventListener('resize', ajustarLayout);

/* ===== eventos ===== */
document.getElementById('lista').addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('[data-acao]') : null;
  if (!b) {                                              /* toque na linha: seleciona e mostra no mapa */
    var ln = e.target.closest ? e.target.closest('[data-sel]') : null;
    if (ln && DIVIDIDA) { selId = ln.getAttribute('data-sel'); desenhar(); atualizarMapa(); }
    return;
  }
  var acao = b.getAttribute('data-acao');
  if (acao === 'lig') {
    var cc = b.closest('.c') || b.closest('.lh');
    avisoTel(cc ? cc.querySelector('.nome').textContent : '', b.getAttribute('data-tel')); return;
  }
  var id = b.getAttribute('data-id');
  if (acao === 'ord') {
    var o = lerOrdem(dia), p = o.indexOf(id);
    if (p >= 0) o.splice(p, 1); else o.push(id);
    gravarOrdem(dia, o); desenhar(); atualizarMapa(); return;
  }
  var ent = lerEnt(dia);
  if (acao === 'ent') { ent[id] = 1; if (selId === id) selId = ''; } else delete ent[id];
  gravarEnt(dia, ent); desenhar(); atualizarMapa();
});
document.getElementById('bSat').onclick = function () { satelite = !satelite; atualizarMapa(); };
document.getElementById('aviso').addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('[data-acao]') : null; if (!b) return;
  var acao = b.getAttribute('data-acao');
  if (acao === 'fechaviso') document.getElementById('aviso').style.display = 'none';
  else if (acao === 'abrirtel') {
    var d = discadorAtual(); if (!d) return;
    var falha = function (m) { alert('Não consegui abrir ' + (d.nome || 'o app') + (m ? ' (' + m + ')' : '') + '. Escolha de novo em ⚙.'); };
    if (window.AndroidPonte) { var rr = window.AndroidPonte.abrirApp(d.pacote); if (rr !== 'ok') falha(rr); }
    else if (Nativo) Nativo.abrirApp({ pacote: d.pacote }).catch(function (e) { falha(e && e.message); });
  }
});
document.getElementById('lista').addEventListener('submit', async function (e) {
  if (!e.target || e.target.id !== 'fLogin') return;
  e.preventDefault();
  var erro = document.getElementById('lErro'); erro.textContent = 'Entrando…';
  if (!sb) { erro.textContent = 'Sem conexão com o servidor.'; return; }
  var r = await sb.auth.signInWithPassword({ email: document.getElementById('lEmail').value.trim(), password: document.getElementById('lSenha').value });
  if (r.error) { erro.textContent = 'E-mail ou senha inválidos'; return; }
  precisaLogin = false; carregar();
});
function irDia(d) { dia = d; cards = []; offline = false; desenhar(); carregar(); }
document.getElementById('bAnt').onclick = function () { irDia(somaDias(dia, -1)); };
document.getElementById('bProx').onclick = function () { irDia(somaDias(dia, 1)); };
document.getElementById('rotDia').onclick = function () { irDia(hoje()); };
document.getElementById('bRef').onclick = function () { carregar(); };
if (NATIVO) { document.getElementById('bCfg').style.display = ''; document.getElementById('bTela').style.display = 'none'; document.querySelector('#cfg .soapk').style.display = 'flex'; }
var _appsCache = null;
function desenharCfg() {
  var f = (document.getElementById('cfgBusca').value || '').trim().toLowerCase(), d = discadorAtual(), sel = d && d.pacote;
  var h = '<button data-p="" class="' + (!sel ? 'sel' : '') + '">Nenhum — usar o discador padrão do Android<small>abre tel:</small></button>';
  (_appsCache || []).filter(function (a) { return !f || a.nome.toLowerCase().indexOf(f) >= 0 || a.pacote.toLowerCase().indexOf(f) >= 0; })
    .forEach(function (a) { h += '<button data-p="' + esc(a.pacote) + '" data-n="' + esc(a.nome) + '" class="' + (a.pacote === sel ? 'sel' : '') + '">' + esc(a.nome) + '<small>' + esc(a.pacote) + '</small></button>'; });
  document.getElementById('cfgLista').innerHTML = h;
}
var _cfgErro = '';
function mostrarMsg(t) { var a = document.getElementById('aviso'); a.innerHTML = '<div class="an">' + esc(t) + '</div>'; a.style.display = 'block'; setTimeout(function () { a.style.display = 'none'; }, 1800); }
document.getElementById('bCfg').onclick = async function () {
  document.getElementById('cfg').style.display = 'flex';
  if (!NATIVO) { document.getElementById('cfgInfo').textContent = 'Versão web'; return; }
  var ua = (/Chrome\/[\d.]+/.exec(navigator.userAgent) || ['WebView ?'])[0];
  document.getElementById('cfgInfo').textContent = 'APK v3 · ' + ua;
  document.getElementById('cfgLista').innerHTML = '<button disabled>Carregando apps…</button>';
  _cfgErro = '';
  var via = window.AndroidPonte ? 'ponte' : (Nativo ? 'plugin' : 'nenhum');
  try {
    var lista;
    if (window.AndroidPonte) {
      var t = window.AndroidPonte.apps();
      if (typeof t !== 'string' || t.indexOf('ERRO') === 0) throw new Error(String(t));
      lista = JSON.parse(t);
    } else if (Nativo) {
      var r = await Nativo.apps();
      if (!r || !r.apps) throw new Error('resposta vazia do plugin: ' + JSON.stringify(r));
      lista = r.apps;
    } else throw new Error('nenhuma função nativa disponível');
    _appsCache = lista.sort(function (a, b) { return a.nome.localeCompare(b.nome, 'pt-BR', { sensitivity: 'base' }); });
  } catch (e) { _appsCache = []; _cfgErro = (e && (e.message || e.errorMessage || e.code)) || String(e); }
  document.getElementById('cfgInfo').textContent = 'APK v3 · ' + ua + ' · via ' + via + ' · ' + _appsCache.length + ' apps' + (_cfgErro ? ' · erro: ' + _cfgErro : '');
  desenharCfg();
};
document.getElementById('cfgUsar').onclick = function () {
  var p = (document.getElementById('cfgPac').value || '').trim(); if (!p) return;
  try { localStorage.setItem('vdf_discador', JSON.stringify({ pacote: p, nome: p })); } catch (x) {}
  desenharCfg();
};
document.getElementById('cfgBusca').oninput = desenharCfg;
document.getElementById('cfgFechar').onclick = function () { document.getElementById('cfg').style.display = 'none'; };
document.getElementById('cfgLista').addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('button[data-p]') : null; if (!b) return;
  try {
    if (b.getAttribute('data-p')) localStorage.setItem('vdf_discador', JSON.stringify({ pacote: b.getAttribute('data-p'), nome: b.getAttribute('data-n') }));
    else localStorage.removeItem('vdf_discador');
  } catch (x) {}
  desenharCfg();
});
var querCheia = false;
function emCheia() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function entrarCheia() { var el = document.documentElement; try { var f = el.requestFullscreen || el.webkitRequestFullscreen; if (f) { var r = f.call(el); if (r && r.catch) r.catch(function () {}); } } catch (e) {} }
function sairCheia() { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} }
document.getElementById('bTela').onclick = function (e) {
  e.stopPropagation();
  if (emCheia()) { querCheia = false; sairCheia(); } else { querCheia = true; entrarCheia(); }
};
/* o primeiro toque em qualquer lugar entra em tela cheia; ao voltar do Maps, o próximo toque entra de novo */
document.addEventListener('click', function () { if (querCheia === false && !window._cheiaIniciada) { window._cheiaIniciada = true; querCheia = true; } if (querCheia && !emCheia()) entrarCheia(); }, true);
document.addEventListener('visibilitychange', function () { if (!document.hidden && Date.now() - ultimaCarga > 60000) carregar(); });
setInterval(function () { if (!document.hidden && !precisaLogin) carregar(); }, ATUALIZA_MS);

limparAntigos();
ajustarLayout();
desenhar();
carregar();
</script>
</body>
</html>
