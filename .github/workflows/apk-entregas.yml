name: APK Entregas

on:
  workflow_dispatch:
  push:
    paths:
      - 'entregas.html'
      - 'entregas-apk/**'
      - '.github/workflows/apk-entregas.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        working-directory: entregas-apk
        run: npm install --no-audit --no-fund

      - name: Montar o projeto Android
        working-directory: entregas-apk
        run: bash preparar.sh

      - name: Usar a chave de assinatura fixa (permite atualizar o app por cima)
        run: |
          mkdir -p ~/.android
          cp entregas-apk/debug.keystore ~/.android/debug.keystore

      - name: Compilar o APK
        working-directory: entregas-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: Entregas-APK
          path: entregas-apk/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
